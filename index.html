<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Happy Birthday</title>
	<meta name="description" content="A happy birthday celebration" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#F6C9A0" />
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>" />

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Parisienne&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="css/style.css" />
</head>
<body>

	<!-- Loading screen, hidden once everything is ready -->
	<div class="loader" id="loader" aria-hidden="true">
		<div class="loader__spinner"></div>
	</div>

	<!-- Background music, started by user gesture in the "music" step -->
	<audio id="bgm" loop preload="none">
		<source src="assets/hbd.mp3" type="audio/mpeg" />
	</audio>

	<!-- Ambient drifting sparkles, purely decorative -->
	<div class="ambient" id="ambient" aria-hidden="true"></div>

	<!-- String of fairy-light bulbs across the top -->
	<ul class="lightstring" id="lightstring" aria-hidden="true"></ul>

	<!-- Balloon field used for the "fly with balloons" scene -->
	<div class="balloon-field" id="balloonField" aria-hidden="true"></div>

	<img class="balloon-border" id="balloonBorder" src="assets/Balloon-Border.png" alt="" aria-hidden="true" />

	<main class="stage">

		<div class="stage__scroll">

			<header class="stage__banner">
				<img src="assets/banner.png" id="banner" alt="Happy Birthday banner" />
			</header>

			<section class="stage__center" id="stageCenter">

				<img id="cakeImg" src="assets/cake128.png" class="cake" alt="Birthday cake" />

				<h1 class="wish-heading" id="wishHeading">Happy Birthday!</h1>

				<div class="story-box" id="storyBox" aria-live="polite">
					<p class="story-line" id="storyLine"></p>
				</div>

			</section>

		</div>

		<footer class="controls">
			<p class="controls__progress" id="progress"></p>
			<button class="btn-primary" id="advanceBtn" type="button">Turn on the Lights</button>
		</footer>

	</main>

	<script src="js/config.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
